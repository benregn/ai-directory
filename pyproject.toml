[project]
name = "githits-directory"
version = "0.1.0"
description = "Local, machine-readable mirror of the githits.com software-factories directory"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
githits-directory = "githits_directory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["githits_directory"]
